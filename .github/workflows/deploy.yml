name: CI/CD - Deploy Windows Container

on:
  push:
    branches:
      - main
      - feature/docker-ci
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Windows Docker image
        run: |
          docker build -f Dockerfile.windows -t natacha6262/schoolproject-app:windows .

      - name: Push Windows Docker image
        run: |
          docker push natacha6262/schoolproject-app:windows

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey ${{ secrets.TS_KEY }} --ssh

      - name: Deploy on Windows Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}      # 100.125.146.119
          port: ${{ secrets.SERVER_PORT }}      # 22
          username: ${{ secrets.SERVER_USER }}  # Administrateur
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            powershell C:\ci_cd_projet\scripts\deploy.ps1

            //test de connexion
